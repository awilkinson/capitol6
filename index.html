<title>Capitol 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">

<style>
/* ============================================================
   CAPITOL 6 — 805 Yates Street, Victoria BC
   A single committed visual world: the house with the lights down.
   Every colour is painted explicitly so the page holds on any ground.
   ============================================================ */

:root{
  color-scheme: dark;

  /* Grounds — warm, brown-biased neutrals. Not grey. */
  --stage:      #0B0A09;
  --house:      #131110;
  --riser:      #1C1917;
  --riser-hi:   #262220;
  --edge:       rgba(242,237,228,.11);
  --edge-soft:  rgba(242,237,228,.06);
  --edge-hard:  rgba(242,237,228,.20);

  /* Text */
  --bone:       #F2EDE4;
  --dust:       #9A9188;
  --dust-dim:   #6B6560;

  /* The lamp — the only accent. Emitted, not applied. */
  --lamp:       #E9B44C;
  --lamp-hi:    #FFD489;
  --lamp-deep:  #B8862B;
  --lamp-ink:   #241B0B;

  /* Semantic — separate from the accent */
  --access:     #6FA8DC;
  --good:       #86B87F;
  --warn:       #E07A5F;
  --taken:      #322D2A;

  /* Type */
  --f-display: 'Instrument Serif', 'Times New Roman', Georgia, serif;
  --f-ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Scale */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px; --s5: 24px;
  --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px; --s10: 128px;

  --wrap: 1180px;
  --rad: 3px;
}

*{ box-sizing: border-box; }

body{
  margin: 0;
  background: var(--stage);
  color: var(--bone);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Ambient: a faint warm bloom at the top of the page, like spill from a marquee */
body::before{
  content:"";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(1100px 420px at 50% -12%, rgba(233,180,76,.075), transparent 62%),
    radial-gradient(700px 500px at 100% 0%, rgba(233,180,76,.035), transparent 60%);
}

a{ color: inherit; text-decoration: none; }
button{ font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea{ font: inherit; color: inherit; }
img{ max-width: 100%; }

:focus-visible{
  outline: 2px solid var(--lamp);
  outline-offset: 2px;
  border-radius: 2px;
}

.wrap{ max-width: var(--wrap); margin: 0 auto; padding: 0 var(--s5); position: relative; z-index: 1; }
.wrap-tight{ max-width: 840px; margin: 0 auto; padding: 0 var(--s5); position: relative; z-index: 1; }

/* ---------- Type primitives ---------- */
.eyebrow{
  font-size: 10.5px; font-weight: 600; letter-spacing: .19em;
  text-transform: uppercase; color: var(--dust); margin: 0;
}
.eyebrow-lamp{ color: var(--lamp); }
.serif{ font-family: var(--f-display); font-weight: 400; letter-spacing: -.005em; }
.mono{ font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1,h2,h3,h4{ margin: 0; text-wrap: balance; font-weight: 600; }
p{ margin: 0; }
.lede{ color: var(--dust); font-size: 16.5px; line-height: 1.65; max-width: 62ch; }
.small{ font-size: 13px; color: var(--dust); }
.xsmall{ font-size: 11.5px; color: var(--dust-dim); }
.stack{ display: flex; flex-direction: column; }
.row-f{ display: flex; align-items: center; }

/* ============================================================
   LOGO — the 6 as a projector aperture
   ============================================================ */
.lockup{ display: inline-flex; align-items: center; gap: 11px; }
.lockup svg{ display: block; overflow: visible; }
.lockup .word{
  font-family: var(--f-ui);
  font-weight: 600;
  letter-spacing: .225em;
  text-transform: uppercase;
  font-size: 15px;
  line-height: 1;
  padding-left: 1px;
  color: var(--bone);
}
.mark-ring{ stroke: var(--bone); }
.mark-beam{ stroke: var(--lamp); }
.mark-lamp{ fill: var(--lamp); }
.lockup:hover .mark-beam{ stroke: var(--lamp-hi); }
.lockup:hover .mark-lamp{ fill: var(--lamp-hi); }
.mark-beam, .mark-lamp{ transition: stroke .3s, fill .3s; }

/* ============================================================
   HEADER
   ============================================================ */
.chrome{
  position: sticky; top: 0; z-index: 60;
  background: rgba(11,10,9,.86);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--edge-soft);
}
.chrome-in{
  max-width: var(--wrap); margin: 0 auto; padding: 0 var(--s5);
  height: 66px; display: flex; align-items: center; gap: var(--s6);
}
.nav{ display: flex; align-items: center; gap: 26px; margin-left: auto; }
.nav a{
  font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  color: var(--dust); padding: 6px 0; position: relative; transition: color .2s;
}
.nav a::after{
  content:""; position: absolute; left: 0; right: 100%; bottom: 0; height: 1px;
  background: var(--lamp); transition: right .28s cubic-bezier(.2,.7,.3,1);
}
.nav a:hover{ color: var(--bone); }
.nav a:hover::after, .nav a.on::after{ right: 0; }
.nav a.on{ color: var(--bone); }

.btn-tix{
  font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  padding: 9px 17px; border-radius: var(--rad);
  color: var(--lamp-ink);
  background: linear-gradient(180deg, var(--lamp-hi), var(--lamp));
  box-shadow: 0 0 0 1px var(--lamp-deep), 0 6px 22px -8px rgba(233,180,76,.7);
  transition: transform .16s, box-shadow .22s, filter .2s;
  white-space: nowrap;
}
.btn-tix:hover{ transform: translateY(-1px); box-shadow: 0 0 0 1px var(--lamp), 0 10px 26px -8px rgba(233,180,76,.85); filter: brightness(1.04); }
.btn-tix:active{ transform: translateY(0); }

.burger{ display: none; margin-left: auto; padding: 8px; }
.burger span{ display: block; width: 20px; height: 1.5px; background: var(--bone); margin: 4px 0; transition: transform .25s, opacity .2s; }
.mobnav{ display: none; border-top: 1px solid var(--edge-soft); background: var(--house); padding: var(--s3) var(--s5) var(--s5); }
.mobnav.open{ display: block; }
.mobnav a{ display: block; padding: 12px 0; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--dust); border-bottom: 1px solid var(--edge-soft); }
.mobnav a:last-child{ border-bottom: 0; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 22px; border-radius: var(--rad);
  font-size: 12.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--edge-hard); color: var(--bone);
  background: var(--riser);
  transition: background .2s, border-color .2s, transform .14s, color .2s;
}
.btn:hover{ background: var(--riser-hi); border-color: var(--edge-hard); transform: translateY(-1px); }
.btn:active{ transform: translateY(0); }
.btn-lamp{
  border-color: transparent; color: var(--lamp-ink);
  background: linear-gradient(180deg, var(--lamp-hi), var(--lamp));
  box-shadow: 0 0 0 1px var(--lamp-deep), 0 8px 26px -10px rgba(233,180,76,.75);
}
.btn-lamp:hover{ background: linear-gradient(180deg, #FFDF9F, var(--lamp-hi)); box-shadow: 0 0 0 1px var(--lamp), 0 12px 30px -10px rgba(233,180,76,.9); }
.btn-ghost{ background: transparent; border-color: var(--edge); color: var(--dust); }
.btn-ghost:hover{ color: var(--bone); border-color: var(--edge-hard); background: rgba(242,237,228,.03); }
.btn-lg{ padding: 15px 30px; font-size: 13px; }
.btn:disabled{ opacity: .34; cursor: not-allowed; transform: none; }
.btn-block{ width: 100%; }

/* ============================================================
   KEY ART — designed title plates, not photographs
   Each film gets a duotone field, a geometric figure and grain.
   ============================================================ */
.art{
  position: relative; overflow: hidden;
  aspect-ratio: 2 / 3;
  background: linear-gradient(158deg, var(--a) 0%, var(--b) 100%);
  border-radius: var(--rad);
  display: flex; flex-direction: column; justify-content: flex-end;
  isolation: isolate;
}
.art::after{ /* grain + vignette */
  content:""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(0,0,0,.42) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.024) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay;
}
.fig{ position: absolute; inset: 0; z-index: 1; opacity: 1; }

/* figures */
.fig-rings{ background:
  radial-gradient(circle at 50% 42%, transparent 0 14%, rgba(255,255,255,.15) 14% 14.6%, transparent 14.6%),
  radial-gradient(circle at 50% 42%, transparent 0 26%, rgba(255,255,255,.13) 26% 26.5%, transparent 26.5%),
  radial-gradient(circle at 50% 42%, transparent 0 39%, rgba(255,255,255,.10) 39% 39.4%, transparent 39.4%),
  radial-gradient(circle at 50% 42%, transparent 0 53%, rgba(255,255,255,.07) 53% 53.4%, transparent 53.4%); }
.fig-wave{ background:
  radial-gradient(140% 62% at 50% 108%, rgba(255,255,255,.20), transparent 62%),
  repeating-linear-gradient(184deg, rgba(255,255,255,.09) 0 1px, transparent 1px 15px); }
.fig-orb{ background:
  radial-gradient(circle at 50% 38%, rgba(255,255,255,.34), rgba(255,255,255,.06) 26%, transparent 46%),
  radial-gradient(circle at 50% 38%, transparent 0 33%, rgba(255,255,255,.12) 33% 33.5%, transparent 33.5%); }
.fig-band{ background:
  linear-gradient(0deg, transparent 0 26%, rgba(255,255,255,.15) 26% 27%, transparent 27% 34%, rgba(255,255,255,.10) 34% 34.6%, transparent 34.6%),
  radial-gradient(90% 44% at 50% 30%, rgba(255,255,255,.22), transparent 70%); }
.fig-split{ background:
  linear-gradient(90deg, transparent 0 47.4%, rgba(255,255,255,.30) 47.4% 48.2%, rgba(0,0,0,.34) 48.2% 51.8%, rgba(255,255,255,.30) 51.8% 52.6%, transparent 52.6%),
  radial-gradient(60% 70% at 50% 44%, rgba(255,255,255,.13), transparent 72%); }
.fig-perf{ background:
  repeating-linear-gradient(90deg, transparent 0 12px, rgba(255,255,255,.10) 12px 20px, transparent 20px 34px),
  linear-gradient(0deg, transparent 0 18%, rgba(0,0,0,.22) 18% 82%, transparent 82%); }
.fig-grid{ background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.085) 0 1px, transparent 1px 22px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.085) 0 1px, transparent 1px 22px),
  radial-gradient(70% 50% at 50% 34%, rgba(255,255,255,.14), transparent 74%); }
.fig-arc{ background:
  radial-gradient(120% 78% at 50% 118%, transparent 0 52%, rgba(255,255,255,.20) 52% 53.2%, transparent 53.2% 66%, rgba(255,255,255,.12) 66% 67%, transparent 67%),
  radial-gradient(80% 46% at 50% 26%, rgba(255,255,255,.16), transparent 72%); }
.fig-beam{ background:
  conic-gradient(from 198deg at 50% -6%, transparent 0deg, rgba(255,255,255,.20) 12deg, transparent 26deg, transparent 334deg, rgba(255,255,255,.13) 348deg, transparent 360deg),
  radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.24), transparent 70%); }
.fig-halo{ background:
  radial-gradient(circle at 50% 30%, rgba(255,255,255,.30) 0 8%, transparent 8.4%),
  radial-gradient(circle at 50% 30%, transparent 0 20%, rgba(255,255,255,.16) 20% 21%, transparent 21%),
  linear-gradient(0deg, rgba(0,0,0,.30), transparent 55%); }

.art-title{
  position: relative; z-index: 2;
  font-family: var(--f-display); font-size: 26px; line-height: 1.03;
  padding: var(--s5) var(--s4) var(--s4);
  color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.65);
  letter-spacing: -.01em;
}
/* In the grid the plate sits above a caption, so its title reads as poster
   typography rather than competing with the film name below it. */
.card .art-title{ font-size: 19px; padding: var(--s5) var(--s3) var(--s3); }
.art-photo img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.art-tag{
  position: absolute; top: 10px; left: 10px; z-index: 3;
  font-size: 9px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase;
  padding: 4px 7px; border-radius: 2px; color: var(--lamp-ink);
  background: rgba(233,180,76,.94); backdrop-filter: blur(4px);
}
.logo-img{ display: block; width: auto; }

.art-title small{
  display: block; font-family: var(--f-ui); font-size: 9.5px; font-weight: 600;
  letter-spacing: .2em; text-transform: uppercase; opacity: .72; margin-bottom: 7px;
  text-shadow: none;
}

/* ============================================================
   HERO
   ============================================================ */
.hero{ padding: var(--s8) 0 var(--s6); position: relative; }
.hero-grid{ display: grid; grid-template-columns: 1.25fr .75fr; gap: var(--s8); align-items: center; }
.hero h1{
  font-family: var(--f-display); font-weight: 400;
  font-size: clamp(48px, 7.4vw, 92px); line-height: .95; letter-spacing: -.025em;
  margin: var(--s4) 0 var(--s5);
}
.hero h1 em{ font-style: italic; color: var(--lamp); }
.hero-meta{ display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; margin-bottom: var(--s5); }
.hero-art{ max-width: 330px; margin-left: auto; box-shadow: 0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px var(--edge); }
.hero-cta{ display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; }

.pill{
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  padding: 5px 9px; border: 1px solid var(--edge); border-radius: 2px; color: var(--dust);
}
.pill-lamp{ color: var(--lamp); border-color: rgba(233,180,76,.4); background: rgba(233,180,76,.07); }
.pill-good{ color: var(--good); border-color: rgba(134,184,127,.35); background: rgba(134,184,127,.07); }
.pill-warn{ color: var(--warn); border-color: rgba(224,122,95,.35); background: rgba(224,122,95,.07); }
.dot{ width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

/* ============================================================
   SECTIONS
   ============================================================ */
.sec{ padding: var(--s8) 0; }
.sec-head{
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--s5); padding-bottom: var(--s5); margin-bottom: var(--s6);
  border-bottom: 1px solid var(--edge-soft);
}
.sec-head h2{
  font-family: var(--f-display); font-weight: 400; letter-spacing: -.02em;
  font-size: clamp(28px, 3.6vw, 40px); line-height: 1.05; margin-top: 6px;
}
.sec-head a{ font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--lamp); white-space: nowrap; }
.sec-head a:hover{ color: var(--lamp-hi); }

/* ============================================================
   DATE STRIP
   ============================================================ */
.datestrip{ display: flex; gap: var(--s2); overflow-x: auto; padding-bottom: var(--s2); scrollbar-width: thin; }
.datechip{
  flex: 0 0 auto; min-width: 82px; padding: 11px 14px 12px;
  border: 1px solid var(--edge); border-radius: var(--rad);
  background: var(--house); text-align: center; position: relative;
  transition: border-color .2s, background .2s, transform .14s;
}
.datechip:hover{ border-color: var(--edge-hard); background: var(--riser); }
.datechip.on{ border-color: var(--lamp); background: rgba(233,180,76,.09); }
.datechip .dow{ font-size: 10px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--dust); }
.datechip.on .dow{ color: var(--lamp); }
.datechip .dnum{ font-family: var(--f-mono); font-size: 21px; line-height: 1.25; }
.datechip .deal{
  display: block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .04em;
  color: var(--lamp); margin-top: 1px;
}

/* ============================================================
   FILM GRID + CARDS
   ============================================================ */
.filmgrid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: var(--s6) var(--s5); }
.card{ display: flex; flex-direction: column; gap: var(--s3); }
.card .art{ box-shadow: 0 0 0 1px var(--edge-soft); transition: transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .3s; }
.card:hover .art{ transform: translateY(-4px); box-shadow: 0 0 0 1px var(--edge-hard), 0 24px 44px -22px rgba(0,0,0,.95); }
.card h3{ font-size: 15px; font-weight: 600; line-height: 1.25; letter-spacing: -.005em; }
.card .cmeta{ display: flex; flex-wrap: wrap; gap: 7px; align-items: center; font-size: 11.5px; color: var(--dust-dim); font-family: var(--f-mono); }
.rat{
  display: inline-block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .03em;
  padding: 1px 5px; border: 1px solid var(--edge); border-radius: 2px; color: var(--dust);
}

/* showtime chips inline on the card — the shortcut to seats */
.times{ display: flex; flex-wrap: wrap; gap: 5px; }
.time{
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .01em;
  padding: 6px 9px; border: 1px solid var(--edge); border-radius: 2px;
  background: var(--house); color: var(--bone); position: relative;
  transition: border-color .18s, background .18s, color .18s, transform .12s;
}
.time:hover{ border-color: var(--lamp); background: rgba(233,180,76,.10); color: var(--lamp-hi); transform: translateY(-1px); }
.time.thin{ color: var(--warn); border-color: rgba(224,122,95,.3); }
.time.thin:hover{ color: var(--lamp-hi); }
.time.gone{ color: var(--dust-dim); border-color: var(--edge-soft); background: transparent; text-decoration: line-through; cursor: not-allowed; }
.time.gone:hover{ transform: none; border-color: var(--edge-soft); background: transparent; color: var(--dust-dim); }
.time-more{ font-family: var(--f-ui); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--lamp); padding: 6px 4px; }

/* ============================================================
   FILM DETAIL
   ============================================================ */
.detail{ padding: var(--s7) 0 var(--s8); }
.detail-grid{ display: grid; grid-template-columns: 300px 1fr; gap: var(--s8); align-items: start; }
.detail h1{
  font-family: var(--f-display); font-weight: 400; letter-spacing: -.025em;
  font-size: clamp(38px, 5.4vw, 66px); line-height: .98; margin: 10px 0 var(--s4);
}
.detail-meta{ display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; margin-bottom: var(--s5); font-family: var(--f-mono); font-size: 12.5px; color: var(--dust); }
.crew{ display: grid; grid-template-columns: 92px 1fr; gap: 8px var(--s4); font-size: 13.5px; margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--edge-soft); }
.crew dt{ font-size: 10.5px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--dust-dim); padding-top: 3px; }
.crew dd{ margin: 0; color: var(--bone); }

.showblock{ border-top: 1px solid var(--edge-soft); padding-top: var(--s5); margin-top: var(--s6); }
.showblock-head{ display: flex; align-items: baseline; gap: var(--s3); margin-bottom: var(--s4); }
.showblock-head h4{ font-size: 12px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; }
.showrow{ display: flex; flex-wrap: wrap; gap: 7px; }
.showcard{
  min-width: 104px; padding: 11px 13px; border: 1px solid var(--edge); border-radius: var(--rad);
  background: var(--house); text-align: left; transition: border-color .2s, background .2s, transform .14s;
}
.showcard:hover{ border-color: var(--lamp); background: rgba(233,180,76,.08); transform: translateY(-2px); }
.showcard .st{ font-family: var(--f-mono); font-size: 16px; line-height: 1.2; }
.showcard .sh{ font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dust-dim); margin-top: 3px; }
.showcard .sl{ font-family: var(--f-mono); font-size: 10.5px; margin-top: 5px; }
.showcard:disabled{ opacity: .35; cursor: not-allowed; }
.showcard:disabled:hover{ transform: none; border-color: var(--edge); background: var(--house); }

/* ============================================================
   BOOKING — the room changes. Site chrome out, booking bar in.
   ============================================================ */
.bookbar{
  position: sticky; top: 0; z-index: 70;
  background: rgba(8,7,6,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--edge-soft);
}
.bookbar-in{ max-width: var(--wrap); margin: 0 auto; padding: 0 var(--s5); height: 68px; display: flex; align-items: center; gap: var(--s5); }
.bb-back{ display: inline-flex; align-items: center; gap: 7px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--dust); transition: color .2s; }
.bb-back:hover{ color: var(--bone); }
.bb-title{ min-width: 0; }
.bb-title .t{ font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb-title .s{ font-family: var(--f-mono); font-size: 11.5px; color: var(--dust); }

.steps{ display: flex; align-items: center; gap: var(--s2); margin-left: auto; }
.step{ display: flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .11em; text-transform: uppercase; color: var(--dust-dim); }
.step i{
  width: 19px; height: 19px; border-radius: 50%; border: 1px solid var(--edge);
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 10px; font-style: normal;
  transition: background .25s, border-color .25s, color .25s;
}
.step.on{ color: var(--bone); }
.step.on i{ background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); }
.step.done{ color: var(--dust); }
.step.done i{ border-color: var(--lamp-deep); color: var(--lamp); }
.step-sep{ width: 18px; height: 1px; background: var(--edge); }

.hold{
  display: flex; align-items: center; gap: 7px; padding: 6px 11px;
  border: 1px solid var(--edge); border-radius: var(--rad);
  font-family: var(--f-mono); font-size: 12.5px; color: var(--dust); white-space: nowrap;
}
.hold.urgent{ border-color: rgba(224,122,95,.5); color: var(--warn); }
.hold .pulse{ width: 5px; height: 5px; border-radius: 50%; background: var(--good); animation: pulse 2.2s ease-in-out infinite; }
.hold.urgent .pulse{ background: var(--warn); animation-duration: .9s; }
@keyframes pulse{ 0%,100%{ opacity: 1; } 50%{ opacity: .25; } }

.booking{ background: #070605; min-height: calc(100vh - 68px); padding-bottom: var(--s9); }
.book-grid{ display: grid; grid-template-columns: 1fr 348px; gap: var(--s7); align-items: start; padding-top: var(--s6); }
/* grid items default to min-width:auto, which would let the seat map's own
   scroller push the whole page sideways. It must never do that. */
.book-grid > *, .hero-grid > *, .detail-grid > *, .visitgrid > *{ min-width: 0; }

/* ============================================================
   THE HALL — arced rows under a lit screen
   ============================================================ */
.hall{
  position: relative; padding: var(--s8) var(--s4) var(--s6);
  border: 1px solid var(--edge-soft); border-radius: var(--rad);
  background: linear-gradient(180deg, #0E0C0B 0%, #080706 100%);
  overflow-x: auto; overflow-y: hidden;
}
.screen{
  position: relative; z-index: 2;
  width: min(78%, 560px); height: 12px; margin: 0 auto var(--s3);
  background: linear-gradient(180deg, var(--lamp-hi), rgba(233,180,76,.35));
  clip-path: polygon(3.5% 0%, 96.5% 0%, 100% 100%, 0% 100%);
  border-radius: 2px;
  box-shadow: 0 0 34px 6px rgba(233,180,76,.34);
}
.screen-lbl{
  position: relative; z-index: 2; text-align: center;
  font-size: 10px; font-weight: 600; letter-spacing: .42em; text-transform: uppercase;
  color: rgba(233,180,76,.6); margin-bottom: var(--s7);
  text-indent: .42em;
}
.spill{ /* light thrown from the screen onto the front rows */
  position: absolute; z-index: 0; left: 50%; top: 52px; transform: translateX(-50%);
  width: 150%; height: 460px; pointer-events: none;
  background:
    radial-gradient(46% 100% at 50% 0%, rgba(233,180,76,.20), rgba(233,180,76,.07) 42%, transparent 74%),
    radial-gradient(90% 70% at 50% 0%, rgba(233,180,76,.07), transparent 68%);
}

/* padding-bottom absorbs the arc's translateY so the back rows are never clipped */
/* .house is the auditorium's true width; the screen and the light spill size
   against it, so they stay centred over the seating however narrow the viewport. */
.house{ position: relative; min-width: max-content; }
.rows{ position: relative; z-index: 2; display: flex; flex-direction: column; gap: 13px; padding: 0 var(--s5) 30px; }
.seatrow{ display: flex; align-items: center; justify-content: center; gap: var(--s3); }
.rowlbl{
  width: 18px; flex: 0 0 18px; text-align: center;
  font-family: var(--f-mono); font-size: 11px; color: var(--dust-dim);
}
.blk{ display: flex; gap: 5px; }
.aisle{ width: 36px; flex: 0 0 36px; }

.seat{
  position: relative;
  width: 24px; height: 22px; flex: 0 0 24px;
  border-radius: 7px 7px 3px 3px;
  background: #2E2825;
  box-shadow: inset 0 0 0 1px rgba(242,237,228,.11);
  transition: background .18s, box-shadow .18s, transform .16s cubic-bezier(.2,.7,.3,1);
  will-change: transform;
}
.seat::before{ /* headrest */
  content:""; position: absolute; left: 4px; right: 4px; top: 3px; height: 2px;
  border-radius: 1px; background: rgba(242,237,228,.16); transition: background .18s;
}
.seat:hover:not(.sold){ background: #453D38; transform: translateY(var(--ty)) rotate(var(--rot)) scale(1.18); z-index: 5; }
.seat.sold{ background: var(--taken); box-shadow: none; cursor: not-allowed; opacity: .5; }
.seat.sold::before{ background: rgba(242,237,228,.045); }

.seat.pick{
  background: linear-gradient(180deg, var(--lamp-hi), var(--lamp));
  box-shadow: inset 0 0 0 1px var(--lamp-hi), 0 0 16px 2px rgba(233,180,76,.5);
  z-index: 4;
}
.seat.pick::before{ background: rgba(36,27,11,.42); }

.seat.wc{ background: #22303C; box-shadow: inset 0 0 0 1px rgba(111,168,220,.45); border-radius: 4px; }
.seat.wc::before{ background: rgba(111,168,220,.55); }
.seat.wc.pick{ background: linear-gradient(180deg, var(--lamp-hi), var(--lamp)); box-shadow: inset 0 0 0 1px var(--lamp-hi), 0 0 16px 2px rgba(233,180,76,.5); }

/* loveseats — joined pairs, no centre armrest */
.seat.loveL{ border-radius: 7px 2px 3px 3px; margin-right: -5px; width: 27px; flex-basis: 27px; }
.seat.loveR{ border-radius: 2px 7px 3px 3px; width: 27px; flex-basis: 27px; }

/* the prime band — genuinely useful, drawn as light not decoration */
.seatrow.prime{ position: relative; }
.seatrow.prime::before{
  content:""; position: absolute; left: 28px; right: 28px; top: -6px; bottom: -6px;
  background: radial-gradient(60% 130% at 50% 50%, rgba(233,180,76,.075), transparent 78%);
  border-radius: 999px; pointer-events: none; z-index: 0;
}

.tip{
  position: fixed; z-index: 90; pointer-events: none;
  padding: 8px 11px; border-radius: var(--rad);
  background: #16130F; border: 1px solid var(--lamp-deep);
  box-shadow: 0 12px 30px -10px rgba(0,0,0,.9);
  font-size: 12px; line-height: 1.45; white-space: nowrap;
  opacity: 0; transform: translate(-50%, -122%) translateY(4px); transition: opacity .14s, transform .14s;
}
.tip.show{ opacity: 1; transform: translate(-50%, -122%); }
.tip .tt{ font-family: var(--f-mono); color: var(--lamp); }
.tip .tb{ color: var(--dust); font-size: 11px; }

#toast.toast{
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  z-index: 200; background: #16130F; border: 1px solid var(--lamp-deep);
  border-radius: var(--rad); padding: 13px 18px; font-size: 13.5px;
  max-width: min(440px, 90vw); box-shadow: 0 20px 46px -18px rgba(0,0,0,.95);
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
}
#toast.toast.show{ opacity: 1; transform: translateX(-50%) translateY(-4px); }

.legend{ display: flex; flex-wrap: wrap; gap: var(--s5); justify-content: center; padding: var(--s6) var(--s4) var(--s2); }
.leg{ display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dust); }
.leg i{ width: 17px; height: 15px; border-radius: 5px 5px 2px 2px; display: block; }
.leg i.av{ background: #2A2523; box-shadow: inset 0 0 0 1px rgba(242,237,228,.09); }
.leg i.pk{ background: var(--lamp); box-shadow: 0 0 10px 1px rgba(233,180,76,.5); }
.leg i.sd{ background: var(--taken); opacity: .6; }
.leg i.ac{ background: #22303C; box-shadow: inset 0 0 0 1px rgba(111,168,220,.45); border-radius: 3px; }
.leg i.lv{ background: #2A2523; box-shadow: inset 0 0 0 1px rgba(242,237,228,.09); width: 26px; border-radius: 5px; }
.leg i.pr{ background: rgba(233,180,76,.16); box-shadow: inset 0 0 0 1px rgba(233,180,76,.3); border-radius: 3px; }

/* party picker */
.partybar{
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s4);
  padding: var(--s4) 0 var(--s5); border-bottom: 1px solid var(--edge-soft); margin-bottom: var(--s5);
}
.stepper{ display: inline-flex; align-items: center; border: 1px solid var(--edge); border-radius: var(--rad); overflow: hidden; }
.stepper button{ width: 34px; height: 34px; display: grid; place-items: center; color: var(--dust); transition: background .18s, color .18s; }
.stepper button:hover:not(:disabled){ background: var(--riser); color: var(--bone); }
.stepper button:disabled{ opacity: .3; cursor: not-allowed; }
.stepper .val{ min-width: 40px; text-align: center; font-family: var(--f-mono); font-size: 15px; border-left: 1px solid var(--edge); border-right: 1px solid var(--edge); height: 34px; display: grid; place-items: center; }

/* ============================================================
   SIDE RAIL (order summary)
   ============================================================ */
.rail{ position: sticky; top: 90px; border: 1px solid var(--edge); border-radius: var(--rad); background: var(--house); }
.rail-head{ padding: var(--s4) var(--s5); border-bottom: 1px solid var(--edge-soft); }
.rail-head .t{ font-size: 14px; font-weight: 600; line-height: 1.3; }
.rail-head .s{ font-family: var(--f-mono); font-size: 11.5px; color: var(--dust); margin-top: 3px; }
.rail-body{ padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); }
.rail-foot{ padding: var(--s4) var(--s5) var(--s5); border-top: 1px solid var(--edge-soft); }

.li{ display: flex; align-items: baseline; justify-content: space-between; gap: var(--s4); font-size: 13.5px; }
.li .n{ color: var(--dust); }
.li .v{ font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.li.total{ font-size: 17px; padding-top: var(--s4); border-top: 1px solid var(--edge-soft); }
.li.total .n{ color: var(--bone); font-weight: 600; }
.li.total .v{ color: var(--lamp); font-size: 21px; }
.li.credit .v{ color: var(--good); }

.seatchip{
  display: flex; align-items: center; gap: var(--s3); padding: 10px 12px;
  border: 1px solid var(--edge-soft); border-radius: var(--rad); background: var(--riser);
}
.seatchip .sid{ font-family: var(--f-mono); font-size: 13px; min-width: 44px; }
.seatchip select{
  margin-left: auto; background: var(--house); border: 1px solid var(--edge);
  border-radius: 2px; padding: 5px 7px; font-size: 12px; cursor: pointer;
}
.seatchip .px{ font-family: var(--f-mono); font-size: 13px; min-width: 52px; text-align: right; }
.seatchip .rm{ color: var(--dust-dim); padding: 2px 4px; font-size: 15px; line-height: 1; transition: color .2s; }
.seatchip .rm:hover{ color: var(--warn); }

.ruleflag{
  font-family: var(--f-mono); font-size: 11px; color: var(--good);
  display: flex; align-items: center; gap: 6px;
}

.empty{ text-align: center; padding: var(--s6) var(--s4); color: var(--dust-dim); font-size: 13px; line-height: 1.6; }

/* ============================================================
   CONCESSIONS
   ============================================================ */
.conc-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: var(--s4); }
.conc{
  border: 1px solid var(--edge); border-radius: var(--rad); background: var(--house);
  padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3);
  transition: border-color .2s, background .2s;
}
.conc.has{ border-color: var(--lamp-deep); background: rgba(233,180,76,.05); }
.conc-top{ display: flex; justify-content: space-between; gap: var(--s3); align-items: flex-start; }
.conc h4{ font-size: 14px; font-weight: 600; line-height: 1.3; }
.conc .cp{ font-family: var(--f-mono); font-size: 14px; color: var(--lamp); white-space: nowrap; }
.conc .cd{ font-size: 12px; color: var(--dust); line-height: 1.5; flex: 1; }
.conc .cf{ display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: auto; }

.toggle{ display: flex; align-items: center; gap: var(--s3); padding: var(--s4); border: 1px solid var(--edge); border-radius: var(--rad); background: var(--house); cursor: pointer; transition: border-color .2s, background .2s; }
.toggle.on{ border-color: var(--lamp-deep); background: rgba(233,180,76,.05); }
.toggle .sw{ width: 38px; height: 22px; border-radius: 11px; background: var(--riser-hi); box-shadow: inset 0 0 0 1px var(--edge); position: relative; flex: 0 0 38px; transition: background .22s; }
.toggle.on .sw{ background: var(--lamp); box-shadow: inset 0 0 0 1px var(--lamp-deep); }
.toggle .sw::after{ content:""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--bone); transition: transform .22s cubic-bezier(.2,.7,.3,1); }
.toggle.on .sw::after{ transform: translateX(16px); background: var(--lamp-ink); }
.toggle .tl{ font-size: 13.5px; font-weight: 500; }
.toggle .td{ font-size: 12px; color: var(--dust); }

/* ============================================================
   FORMS / CHECKOUT
   ============================================================ */
.field{ display: flex; flex-direction: column; gap: 7px; }
.field label{ font-size: 10.5px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--dust); }
.field input, .field select{
  background: var(--stage); border: 1px solid var(--edge); border-radius: var(--rad);
  padding: 12px 13px; font-size: 14px; transition: border-color .2s, background .2s;
}
.field input::placeholder{ color: var(--dust-dim); }
.field input:focus, .field select:focus{ border-color: var(--lamp-deep); background: var(--house); outline: none; }
.field input:focus-visible, .field select:focus-visible{ outline: 2px solid var(--lamp); outline-offset: 1px; }
.f2{ display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
.f3{ display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s4); }

.panel{ border: 1px solid var(--edge); border-radius: var(--rad); background: var(--house); padding: var(--s5); }
.panel + .panel{ margin-top: var(--s4); }
.panel h3{ font-size: 12px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; margin-bottom: var(--s4); color: var(--dust); }

.express{ display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.paybtn{
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px; border-radius: var(--rad); font-size: 14px; font-weight: 600;
  background: var(--bone); color: #0B0A09; transition: filter .18s, transform .14s;
}
.paybtn:hover{ filter: brightness(.92); transform: translateY(-1px); }
.paybtn.g{ background: var(--riser-hi); color: var(--bone); box-shadow: inset 0 0 0 1px var(--edge-hard); }
.paybtn.g:hover{ filter: none; background: #302B28; }
.orline{ display: flex; align-items: center; gap: var(--s4); margin: var(--s5) 0; color: var(--dust-dim); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; }
.orline::before, .orline::after{ content:""; flex: 1; height: 1px; background: var(--edge-soft); }

/* ============================================================
   CONFIRMATION — a wallet pass
   ============================================================ */
.pass{
  max-width: 420px; margin: 0 auto;
  border: 1px solid var(--edge); border-radius: 6px; background: var(--house);
  overflow: hidden; box-shadow: 0 40px 90px -40px rgba(0,0,0,.95);
}
.pass-top{
  padding: var(--s5); background: linear-gradient(160deg, rgba(233,180,76,.16), rgba(233,180,76,.02));
  border-bottom: 1px solid var(--edge-soft);
}
.pass-top h3{ font-family: var(--f-display); font-weight: 400; font-size: 27px; line-height: 1.08; letter-spacing: -.015em; margin: var(--s3) 0 6px; }
.pass-body{ padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
.pass-facts{ display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4) var(--s5); }
.fact .k{ font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--dust-dim); }
.fact .v{ font-family: var(--f-mono); font-size: 15px; margin-top: 3px; }
.perf{ position: relative; height: 1px; background: repeating-linear-gradient(90deg, var(--edge-hard) 0 6px, transparent 6px 12px); }
.perf::before, .perf::after{ content:""; position: absolute; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #070605; }
.perf::before{ left: -9px; } .perf::after{ right: -9px; }
.qr{ display: grid; grid-template-columns: repeat(25, 1fr); width: 168px; height: 168px; margin: 0 auto; background: var(--bone); padding: 8px; border-radius: 3px; }
.qr span{ background: transparent; }
.qr span.on{ background: #0B0A09; }

/* ============================================================
   CONTENT PAGES (pricing / faq / etc.)
   ============================================================ */
.page{ padding: var(--s8) 0 var(--s9); }
.page h1{ font-family: var(--f-display); font-weight: 400; letter-spacing: -.025em; font-size: clamp(38px, 5.6vw, 62px); line-height: 1; margin: 10px 0 var(--s5); }
.page h2{ font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: -.015em; margin: var(--s7) 0 var(--s4); }
.page p + p{ margin-top: var(--s4); }
.prose{ color: var(--dust); font-size: 15.5px; line-height: 1.72; max-width: 66ch; }
.prose strong{ color: var(--bone); font-weight: 600; }

.ptable{ width: 100%; border-collapse: collapse; }
.ptable th{ text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--dust-dim); padding: 0 0 var(--s3); border-bottom: 1px solid var(--edge); }
.ptable td{ padding: 15px 0; border-bottom: 1px solid var(--edge-soft); vertical-align: top; }
.ptable td:last-child{ text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--lamp); white-space: nowrap; font-size: 15px; }
.ptable .sub{ display: block; font-size: 12.5px; color: var(--dust-dim); margin-top: 3px; }

.faq details{ border-bottom: 1px solid var(--edge-soft); }
.faq summary{ padding: 19px 0; cursor: pointer; font-size: 15.5px; font-weight: 500; list-style: none; display: flex; justify-content: space-between; gap: var(--s4); align-items: center; transition: color .2s; }
.faq summary::-webkit-details-marker{ display: none; }
.faq summary:hover{ color: var(--lamp); }
.faq summary::after{ content: "+"; font-family: var(--f-mono); font-size: 19px; color: var(--lamp); transition: transform .25s; flex: 0 0 auto; }
.faq details[open] summary::after{ transform: rotate(45deg); }
.faq .ans{ padding: 0 0 21px; color: var(--dust); font-size: 14.5px; line-height: 1.7; max-width: 64ch; }

.tiles{ display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1px; background: var(--edge-soft); border: 1px solid var(--edge-soft); }
.tile{ background: var(--stage); padding: var(--s5); }
.tile .num{ font-family: var(--f-display); font-size: 44px; line-height: 1; color: var(--lamp); letter-spacing: -.02em; }
.tile .lbl{ font-size: 12px; color: var(--dust); margin-top: var(--s3); line-height: 1.5; }

.gcards{ display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--s4); }
.gcard{
  aspect-ratio: 1.586; border-radius: 6px; padding: var(--s4);
  background: linear-gradient(145deg, #1E1A16, #0E0C0B);
  box-shadow: inset 0 0 0 1px var(--edge), 0 20px 40px -24px rgba(0,0,0,.9);
  display: flex; flex-direction: column; justify-content: space-between;
  transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
}
.gcard:hover{ transform: translateY(-4px); box-shadow: inset 0 0 0 1px var(--lamp-deep), 0 26px 50px -24px rgba(0,0,0,.95); }
.gcard .amt{ font-family: var(--f-mono); font-size: 30px; color: var(--lamp); }

.visitgrid{ display: grid; grid-template-columns: 1fr 1fr; gap: var(--s7); align-items: start; }
.visitgrid h2:first-child{ margin-top: 0; }

/* map */
.mapbox{ border: 1px solid var(--edge); border-radius: var(--rad); background: var(--house); overflow: hidden; }
.mapbox svg{ display: block; width: 100%; height: auto; }

/* ============================================================
   FOOTER
   ============================================================ */
.foot{ border-top: 1px solid var(--edge-soft); padding: var(--s8) 0 var(--s6); margin-top: var(--s8); background: #080706; position: relative; z-index: 1; }
.foot-grid{ display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: var(--s7); }
.foot h5{ font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--dust-dim); margin-bottom: var(--s4); }
.foot ul{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.foot a{ font-size: 13.5px; color: var(--dust); transition: color .2s; }
.foot a:hover{ color: var(--lamp); }
.foot-addr{ font-size: 13.5px; color: var(--dust); line-height: 1.75; margin-top: var(--s4); }
.foot-addr a{ font-family: var(--f-mono); }
.foot-base{
  margin-top: var(--s8); padding-top: var(--s5); border-top: 1px solid var(--edge-soft);
  display: flex; flex-wrap: wrap; gap: var(--s4); justify-content: space-between; align-items: center;
}

.proto{
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  padding: 3px 7px; border: 1px dashed rgba(224,122,95,.45); border-radius: 2px; color: var(--warn);
}

/* ============================================================
   MOTION — house lights going down
   ============================================================ */
@keyframes rowin{ from{ opacity: 0; transform: translateY(14px); } to{ opacity: 1; transform: translateY(0); } }
@keyframes fadein{ from{ opacity: 0; transform: translateY(9px); } to{ opacity: 1; transform: translateY(0); } }
@keyframes glowup{ from{ opacity: 0; } to{ opacity: 1; } }
/* The house lights go down once, when you walk in — not on every re-render.
   Only a .hall-enter map animates; later renders paint instantly. */
.hall-enter .anim-row{ animation: rowin .5s cubic-bezier(.2,.7,.3,1) both; }
.hall-enter .screen, .hall-enter .spill, .hall-enter .screen-lbl{ animation: glowup .9s ease both; }
.anim-in{ animation: fadein .4s cubic-bezier(.2,.7,.3,1) both; }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
/* ============================================================
   MOBILE — the booking rail becomes a bottom sheet, the way every
   ticketing app people already know works. Collapsed it shows the
   count, the total and the action; tapping it opens the detail.
   ============================================================ */
.rail-bar{ display: none; }
.sheet-scrim{ display: none; }

      seats.push({ n: i+1, kind: kind, aisleAfter: (i === half-1) });
    }
    rows.push({ label: ROWLETTERS[ri], seats: seats, count: count });
  });
  return { no: houseNo, rows: rows, total: h.seats, name: h.name, note: h.note };
}

/* Sightline: peaks about two-thirds back, dead centre. */
function sightline(ri, nRows, si, nSeats){
  var r = nRows > 1 ? ri/(nRows-1) : 0.5;
  var rowScore = 1 - Math.min(1, Math.abs(r - 0.68) / 0.62);
  var c = nSeats > 1 ? Math.abs((si - (nSeats-1)/2) / ((nSeats-1)/2)) : 0;
  var colScore = 1 - c;
  return Math.round((rowScore*0.55 + colScore*0.45) * 100);
}

function seatState(show, rowLabel, seatNo){
  return rnd(show.id + "#" + rowLabel + seatNo) < show.occ ? "sold" : "free";
}

/* ════════════════════════════════════════════════════════════
   4. PRICING RULES — the box office, in code
   ════════════════════════════════════════════════════════════ */

function priceFor(type, show){
  var dw = dowIndex(show.date);
  var candidates = [];
  var reason = TYPE_LABEL[type];

  if (dw === 2){ candidates.push([PRICES.tuesday, "Tuesday — all ages"]); }
  if (dw === 1 && type === "senior"){ candidates.push([PRICES.seniorMonday, "Seniors Monday"]); }
  if (show.mat){ candidates.push([PRICES.matinee, "Matinee (before 4:00 PM)"]); }
  candidates.push([PRICES[type], reason]);

  var best = candidates[0];
  candidates.forEach(function(c){ if (c[0] < best[0]) best = c; });

  var amt = best[0];
  if (show.fmt === "3D") amt += PRICES.threeD;
  return { amount: amt, rule: best[1], threeD: show.fmt === "3D" };
}

function money(n){ return "$" + n.toFixed(2); }

var holdTimer = null;
var hallAnimated = false;   // the lights-down sequence plays once per auditorium

function startHold(){
  S.holdEnds = Date.now() + 7*60*1000;
  if (holdTimer) clearInterval(holdTimer);
  holdTimer = setInterval(tickHold, 1000);
}
function stopHold(){ if (holdTimer) clearInterval(holdTimer); holdTimer = null; S.holdEnds = null; }
function tickHold(){
  var el = document.getElementById("holdclock");
  if (!el || !S.holdEnds) return;
  var left = Math.max(0, S.holdEnds - Date.now());
  var m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
  el.textContent = m + ":" + (s<10?"0":"") + s;
  var wrap = el.closest(".hold");
  if (wrap) wrap.classList.toggle("urgent", left < 90000);
  if (left <= 0){
    stopHold();
    S.seats = []; S.types = {};
    go("film", { filmId: S.filmId });
    toast("Your seat hold expired. Nothing was charged — pick your seats again.");
  }
}

function go(view, patch){
  if (patch) for (var k in patch) S[k] = patch[k];
  S.view = view;
  S.menuOpen = false;
  S.railOpen = false;
  if (view !== "seats" && view !== "addons" && view !== "checkout") stopHold();
  render();
  window.scrollTo(0, 0);
}

function toast(msg){
  var t = document.getElementById("toast");
  if (!t){
    t = document.createElement("div");
    t.id = "toast";
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(function(){ t.classList.add("show"); });
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("show"); }, 4200);
}

function timeChips(filmId, date, limit){
  var shows = showsFor(filmId, date);

  var html = shown.map(function(s){
    if (passed(s)) return '<span class="time gone" title="This show has started">'+fmtTimeShort(s.mins)+'</span>';
    var left = Math.round(HOUSES[s.house].seats * (1 - s.occ));

      + fmtTimeShort(s.mins) + '</button>';
  }).join("");
  if (limit && shows.length > limit){
    html += '<button class="time-more" data-go="film" data-film="'+filmId+'">+'+(shows.length-limit)+'</button>';
  }
  if (!shows.length) html = '<span class="xsmall">No screenings this day</span>';

  var nRows = hall.rows.length;
  var entering = !hallAnimated;
  hallAnimated = true;

  var rowsHtml = hall.rows.map(function(row, ri){
    var isPrimeRow = false;
    var seatsHtml = ["", ""]; // left block, right block
    row.seats.forEach(function(seat, si){
      var id = row.label + seat.n;
      var score = sightline(ri, nRows, si, row.count);
      if (score >= 78) isPrimeRow = true;
      var state = seatState(show, row.label, seat.n);
      var picked = S.seats.some(function(x){ return x.id === id; });

      // Arc: row ends sit further from the screen, and every seat turns to face it.
      // Depth stays under the 13px row gap so curved rows never collide.
      var c = row.count > 1 ? (si - (row.count-1)/2) / ((row.count-1)/2) : 0;
      var depth = 4 + ri * 0.9;
      var ty = (c*c * depth).toFixed(1);
      var rot = (c * 2.2).toFixed(1);

      var cls = "seat";
      if (seat.kind === "wc") cls += " wc";
      if (seat.kind === "loveL") cls += " loveL";
      if (seat.kind === "loveR") cls += " loveR";
      if (state === "sold") cls += " sold";
      if (picked) cls += " pick";

      var label = seat.kind === "wc" ? "Wheelchair position"
                : seat.kind === "comp" ? "Companion seat"
                : (seat.kind === "loveL" || seat.kind === "loveR") ? "Loveseat recliner"
                : "Power recliner";

      var btn = '<button class="'+cls+'"'
        + ' style="--ty:'+ty+'px;--rot:'+rot+'deg;transform:translateY('+ty+'px) rotate('+rot+'deg)"'
        + ' data-seat="'+id+'" data-kind="'+seat.kind+'" data-score="'+score+'" data-label="'+label+'"'
        + ' data-state="'+state+'"'
        + ' aria-label="Row '+row.label+' seat '+seat.n+', '+label+', '+(state==="sold"?"unavailable":"available")+'"'
        + ' aria-pressed="'+(picked?"true":"false")+'"'
        + (state === "sold" ? ' disabled' : '')
        + '></button>';

      seatsHtml[ si < row.count/2 ? 0 : 1 ] += btn;
    });

    return '<div class="seatrow'+(isPrimeRow?" prime":"")+' anim-row" style="animation-delay:'+(entering ? ri*55 : 0)+'ms">'
      + '<span class="rowlbl">'+row.label+'</span>'
      + '<div class="blk">'+seatsHtml[0]+'</div>'
      + '<div class="aisle"></div>'
      + '<div class="blk">'+seatsHtml[1]+'</div>'
      + '<span class="rowlbl">'+row.label+'</span>'
      + '</div>';
  }).join("");

  var free = 0;
  hall.rows.forEach(function(row){
    row.seats.forEach(function(s){ if (seatState(show, row.label, s.n) === "free") free++; });
  });

  return '<div class="booking"><div class="wrap"><div class="book-grid">'

  + '<div>'
    + '<div class="partybar">'
      + '<div><p class="eyebrow" style="margin-bottom:7px">How many</p>'
        + '<div class="stepper">'
          + '<button data-party="-1" aria-label="One fewer ticket"'+(S.party<=1?" disabled":"")+'>−</button>'
          + '<span class="val">'+S.party+'</span>'
          + '<button data-party="1" aria-label="One more ticket"'+(S.party>=8?" disabled":"")+'>+</button>'
        + '</div>'
      + '</div>'
      + '<div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">'
        + '<button class="btn btn-ghost" id="autopick">Best available</button>'
        + '<button class="btn btn-ghost" id="clearseats"'+(S.seats.length?"":" disabled")+'>Clear</button>'
      + '</div>'
    + '</div>'

    + '<p class="small" style="margin-bottom:20px">'
      + '<strong style="color:var(--bone)">'+free+' of '+hall.total+'</strong> seats open in '+hall.name+'. '
      + 'Tap any seat and we will take the '+S.party+' best together from there.</p>'

    + '<div class="hall'+(entering ? " hall-enter" : "")+'">'
      + '<div class="house">'
        + '<div class="spill"></div>'
        + '<div class="screen"></div>'
        + '<div class="screen-lbl">Screen</div>'
        + '<div class="rows" id="rows">'+rowsHtml+'</div>'
      + '</div>'
    + '</div>'

    + '<div class="legend">'
      + '<span class="leg"><i class="av"></i>Available</span>'
      + '<span class="leg"><i class="pk"></i>Yours</span>'
      + '<span class="leg"><i class="sd"></i>Taken</span>'
      + '<span class="leg"><i class="lv"></i>Loveseat — no centre armrest</span>'
      + '<span class="leg"><i class="ac"></i>Wheelchair &amp; companion</span>'
      + '<span class="leg"><i class="pr"></i>Best sightlines</span>'
    + '</div>'
  + '</div>'

  + renderRail("seats")
  + '</div></div></div>';
}

/* ── ORDER MATHS ──────────────────────────────────────────── */
function orderTotals(){
  var show = getShow(S.showId);
  var tickets = S.seats.map(function(s){
    var t = S.types[s.id] || "adult";
    var p = priceFor(t, show);
    return { seat: s, type: t, price: p.amount, rule: p.rule };
  });
  var ticketSub = tickets.reduce(function(a,b){ return a + b.price; }, 0);
  var fees = tickets.length * PRICES.fee;

  var addonList = [];
  for (var id in S.addons){
    if (!S.addons[id]) continue;
    var item = CONCESSIONS.find(function(c){ return c.id === id; });
    if (item) addonList.push({ item: item, qty: S.addons[id], line: item.price * S.addons[id] });
  }
  var addonSub = addonList.reduce(function(a,b){ return a + b.line; }, 0);
  var delivery = (S.deliver && addonSub > 0) ? 2.50 : 0;

  var sub = ticketSub + fees + addonSub + delivery;
  var gst = sub * 0.05;
  var total = sub + gst;
  var points = Math.round(total * 10);

  return { tickets:tickets, ticketSub:ticketSub, fees:fees, addonList:addonList,
           addonSub:addonSub, delivery:delivery, sub:sub, gst:gst, total:total, points:points };
}

/* ── SIDE RAIL ────────────────────────────────────────────── */
function renderRail(stage){
  var show = getShow(S.showId), film = getFilm(S.filmId);
  var T = orderTotals();
  var dw = dowIndex(show.date);

  var seatRows = S.seats.length
    ? S.seats.map(function(s){
        var t = S.types[s.id] || "adult";
        var p = priceFor(t, show);
        return '<div class="seatchip">'
          + '<span class="sid">'+s.id+'</span>'
          + '<select data-type="'+s.id+'" aria-label="Ticket type for seat '+s.id+'">'
            + Object.keys(TYPE_LABEL).map(function(k){
                return '<option value="'+k+'"'+(k===t?" selected":"")+'>'+TYPE_LABEL[k]+'</option>';
              }).join("")
          + '</select>'
          + '<span class="px">'+money(p.amount)+'</span>'
          + '<button class="rm" data-drop="'+s.id+'" aria-label="Remove seat '+s.id+'">×</button>'
          + '</div>';
      }).join("")
    : '<div class="empty">No seats yet.<br>Pick '+S.party+' on the map, or let us choose.</div>';

  var ruleNote = "";
  if (S.seats.length){
    var rules = {};
    T.tickets.forEach(function(t){ if (t.rule.indexOf("Adult")<0 && t.rule.indexOf("Senior (")<0 && t.rule.indexOf("Child")<0) rules[t.rule] = 1; });
    var rs = Object.keys(rules);
    if (rs.length) ruleNote = '<div class="ruleflag"><span class="dot"></span>'+rs.join(" · ")+' applied</div>';
  }

  var cta = "";
  if (stage === "seats"){
    var ready = S.seats.length > 0;
    cta = '<button class="btn btn-lamp btn-block btn-lg" id="toaddons"'+(ready?"":" disabled")+'>'
        + (ready ? "Continue — " + money(T.total) : "Choose "+S.party+" seat"+(S.party>1?"s":"")) + '</button>'

  // The collapsed sheet has to answer "what am I buying and what does it cost"

    ? S.seats.length + (S.seats.length === 1 ? " seat" : " seats")

  var barSub = S.seats.length
    ? S.seats.map(function(s){ return s.id; }).join(", ")

  return (S.railOpen ? '<div class="sheet-scrim" data-sheet="close"></div>' : '')
    + '<aside class="rail'+(S.railOpen ? " open" : "")+'">'
    + '<button class="rail-bar" data-sheet="toggle" aria-expanded="'+(S.railOpen?"true":"false")+'">'
      + '<span class="rb-txt"><b>'+barTitle+'</b><span>'+esc(barSub)+'</span></span>'
      + '<span class="rb-total">'+money(T.total)+'</span>'
      + '<svg class="rb-chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">'

    + '</button>'

          + '<div class="li"><span class="n">Tickets ('+S.seats.length+')</span><span class="v">'+money(T.ticketSub)+'</span></div>'
          + (T.addonSub ? addonLines : "")

          + '<div class="li"><span class="n">GST (5%)</span><span class="v">'+money(T.gst)+'</span></div>'

/* ── CONFIRMATION ─────────────────────────────────────────── */
function qrGrid(seed){
  var cells = "";
  for (var y=0; y<25; y++){
    for (var x=0; x<25; x++){
      var on;
      if ((x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17)){
        var lx = x>17 ? x-18 : x, ly = y>17 ? y-18 : y;
        var edge = (lx===0||lx===6||ly===0||ly===6);
        var core = (lx>=2&&lx<=4&&ly>=2&&ly<=4);
        on = edge || core;
      } else {
        on = rnd(seed + ":" + x + ":" + y) > 0.52;
      }
      cells += '<span'+(on?' class="on"':'')+'></span>';
    }
  }
  return '<div class="qr" role="img" aria-label="Ticket QR code">'+cells+'</div>';
}

/* ════════════════════════════════════════════════════════════
   10. SEAT PICKING LOGIC
   ════════════════════════════════════════════════════════════ */

function hallData(){
  var show = getShow(S.showId);
  var hall = buildHall(show.house);
  return { show: show, hall: hall };
}

/* Take a contiguous run of `party` seats around the tapped one. */
function pickAround(rowLabel, seatNo){
  var d = hallData(), show = d.show, hall = d.hall;
  var ri = -1;
  for (var i=0;i<hall.rows.length;i++) if (hall.rows[i].label === rowLabel) ri = i;
  if (ri < 0) return;
  var row = hall.rows[ri];
  var nRows = hall.rows.length;

  var si = seatNo - 1;
  var free = row.seats.map(function(s){ return seatState(show, row.label, s.n) === "free"; });

  if (!free[si]) return;

  // Grow left and right from the tapped seat, staying inside one half where possible.
  var chosen = [si];
  var l = si - 1, r = si + 1;
  while (chosen.length < S.party && (l >= 0 || r < row.count)){
    var tookR = false;
    if (r < row.count && free[r]){ chosen.push(r); r++; tookR = true; }
    if (chosen.length >= S.party) break;
    if (l >= 0 && free[l]){ chosen.unshift(l); l--; }
    else if (!tookR){ if (r < row.count) r++; else if (l >= 0) l--; else break; }
    if (l < 0 && r >= row.count) break;
  }

  S.seats = chosen.slice(0, S.party).map(function(idx){
    var seat = row.seats[idx];
    return { id: row.label + seat.n, row: row.label, n: seat.n, kind: seat.kind,
             score: sightline(ri, nRows, idx, row.count) };
  });
  S.types = {};
  S.seats.forEach(function(s){ S.types[s.id] = "adult"; });
  if (!S.holdEnds) startHold();
}

/* Best contiguous block in the house by mean sightline. */
function autoPick(){
  var d = hallData(), show = d.show, hall = d.hall;
  var nRows = hall.rows.length;
  var best = null;

  hall.rows.forEach(function(row, ri){
    var free = row.seats.map(function(s){ return seatState(show, row.label, s.n) === "free"; });
    for (var start=0; start + S.party <= row.count; start++){
      var ok = true, sum = 0;
      for (var k=0; k<S.party; k++){
        if (!free[start+k]){ ok = false; break; }
        sum += sightline(ri, nRows, start+k, row.count);
      }
      if (!ok) continue;
      // keep a party together on one side of the aisle where possible
      var half = row.count/2;
      var crosses = (start < half && start + S.party > half);
      var mean = sum / S.party - (crosses ? 6 : 0);
      if (!best || mean > best.mean) best = { ri: ri, row: row, start: start, mean: mean };
    }
  });

  if (best){
    S.seats = [];
    for (var k=0; k<S.party; k++){
      var idx = best.start + k, seat = best.row.seats[idx];
      S.seats.push({ id: best.row.label + seat.n, row: best.row.label, n: seat.n, kind: seat.kind,
                     score: sightline(best.ri, nRows, idx, best.row.count) });
    }
    S.types = {};
    S.seats.forEach(function(s){ S.types[s.id] = "adult"; });
    if (!S.holdEnds) startHold();
    toast("Row " + best.row.label + " — the best " + S.party + " together in this house.");
    return;
  }

  // Nothing contiguous left. Take the best seats we do have and say so plainly,
  // rather than dead-ending on a house that is nearly full.
  var pool = [];
  hall.rows.forEach(function(row, ri){
    row.seats.forEach(function(seat, si){
      if (seatState(show, row.label, seat.n) !== "free") return;
      pool.push({ id: row.label + seat.n, row: row.label, n: seat.n, kind: seat.kind,
                  score: sightline(ri, nRows, si, row.count) });
    });
  });

  if (!pool.length){ toast("This screening is sold out. Try another time."); return; }

  pool.sort(function(a,b){ return b.score - a.score; });
  var take = Math.min(S.party, pool.length);
  S.seats = pool.slice(0, take);
  S.types = {};
  S.seats.forEach(function(s){ S.types[s.id] = "adult"; });
  if (!S.holdEnds) startHold();

  var rowsUsed = {};
  S.seats.forEach(function(s){ rowsUsed[s.row] = 1; });
  var nGroups = Object.keys(rowsUsed).length;

  if (take < S.party){
    toast("Only " + take + " seat" + (take>1?"s":"") + " left in this house, so that is what we held. Try another showing for all " + S.party + ".");
  } else {
    toast("No " + S.party + " together here — these are the best " + S.party + " available, across " + nGroups + " rows.");
  }
}

/* ════════════════════════════════════════════════════════════
   11. RENDER + EVENTS
   ════════════════════════════════════════════════════════════ */

var VIEWS = {
  home: viewHome, soon: viewSoon, film: viewFilm, seats: viewSeats,
  addons: viewAddons, checkout: viewCheckout, confirm: viewConfirm,
  pricing: viewPricing, theatre: viewTheatre, visit: viewVisit,
  gift: viewGift, private: viewPrivate, faq: viewFaq, privacy: viewPrivacy
};

function render(){
  renderChrome();
  document.getElementById("app").innerHTML = (VIEWS[S.view] || viewHome)();
  renderFoot();
  if (S.holdEnds) tickHold();
  if (S.view === "seats") centreHall();
}

/* On a narrow screen the hall is wider than the viewport. Open on the middle of
   the auditorium rather than the left wall, and keep the selection in frame. */
function centreHall(){
  var hall = document.querySelector(".hall");
  if (!hall) return;
  var over = hall.scrollWidth - hall.clientWidth;
  if (over <= 0) return;
  var target = over / 2;
  var picks = hall.querySelectorAll(".seat.pick");
  if (picks.length){
    var l = Infinity, r = -Infinity;
    for (var i = 0; i < picks.length; i++){
      l = Math.min(l, picks[i].offsetLeft);
      r = Math.max(r, picks[i].offsetLeft + picks[i].offsetWidth);
    }
    target = Math.max(0, Math.min(over, (l + r) / 2 - hall.clientWidth / 2));
  }
  hall.scrollLeft = target;
}

/* ── one delegated click handler for the whole prototype ──── */
document.addEventListener("click", function(e){

  var burger = e.target.closest("#burger");
  if (burger){ S.menuOpen = !S.menuOpen; renderChrome(); return; }

  // mobile order sheet
  var sheet = e.target.closest("[data-sheet]");
  if (sheet){
    e.preventDefault();
    S.railOpen = sheet.getAttribute("data-sheet") === "toggle" ? !S.railOpen : false;
    render();
    return;
  }

  // showtime → seat selection
  var showBtn = e.target.closest("[data-show]");
  if (showBtn && !showBtn.disabled){
    e.preventDefault();
    var sid = showBtn.getAttribute("data-show");
    var sh = getShow(sid);
    S.seats = []; S.types = {}; S.addons = {}; S.deliver = false;
    hallAnimated = false;
    startHold();
    go("seats", { showId: sid, filmId: sh.filmId, date: sh.date });
    return;
  }

  // date chips
  var dc = e.target.closest("[data-date]");
  if (dc){
    e.preventDefault();
    var f = dc.getAttribute("data-film");
    go(f ? "film" : S.view, f ? { date: dc.getAttribute("data-date"), filmId: f } : { date: dc.getAttribute("data-date") });
    return;
  }

  // navigation
  var nav = e.target.closest("[data-go]");
  if (nav){
    e.preventDefault();
    var v = nav.getAttribute("data-go");
    var film = nav.getAttribute("data-film");
    go(v, film ? { filmId: film } : null);
    return;
  }

  // party size
  var party = e.target.closest("[data-party]");
  if (party && !party.disabled){
    var delta = +party.getAttribute("data-party");
    S.party = Math.max(1, Math.min(8, S.party + delta));
    if (S.seats.length > S.party){
      S.seats = S.seats.slice(0, S.party);
    } else if (S.seats.length && S.seats.length < S.party){
      S.seats = []; S.types = {};
      toast("Party size changed — pick your seats again.");
    }
    render();
    return;
  }

  // seat
  var seat = e.target.closest(".seat");
  if (seat && !seat.disabled){
    var id = seat.getAttribute("data-seat");
    var already = S.seats.some(function(x){ return x.id === id; });
    if (already){
      S.seats = S.seats.filter(function(x){ return x.id !== id; });
      delete S.types[id];
    } else if (S.seats.length >= S.party){
      pickAround(id.charAt(0), +id.slice(1));
    } else {
      var d = hallData(), hall = d.hall;
      var rowLabel = id.charAt(0), n = +id.slice(1);
      var ri = -1; for (var i=0;i<hall.rows.length;i++) if (hall.rows[i].label===rowLabel) ri=i;
      var row = hall.rows[ri];
      S.seats.push({ id:id, row:rowLabel, n:n, kind: seat.getAttribute("data-kind"),
                     score: +seat.getAttribute("data-score") });
      S.types[id] = "adult";
      if (S.seats.length === 1 && S.party > 1) pickAround(rowLabel, n);
    }
    if (S.seats.length && !S.holdEnds) startHold();
    render();
    return;
  }

  if (e.target.closest("#autopick")){ autoPick(); render(); return; }
  if (e.target.closest("#clearseats")){ S.seats = []; S.types = {}; render(); return; }

  var drop = e.target.closest("[data-drop]");
  if (drop){
    var did = drop.getAttribute("data-drop");
    S.seats = S.seats.filter(function(x){ return x.id !== did; });
    delete S.types[did];
    render(); return;
  }

  // concessions
  var conc = e.target.closest("[data-conc]");
  if (conc && !conc.disabled){
    var cid = conc.getAttribute("data-conc"), cd = +conc.getAttribute("data-d");
    S.addons[cid] = Math.max(0, Math.min(20, (S.addons[cid] || 0) + cd));
    if (!Object.keys(S.addons).some(function(k){ return S.addons[k] > 0; })) S.deliver = false;
    render(); return;
  }
  if (e.target.closest("#deliver")){
    var any = Object.keys(S.addons).some(function(k){ return S.addons[k] > 0; });
    if (any){ S.deliver = !S.deliver; render(); }
    return;
  }

  // flow
  if (e.target.closest("#toaddons")){ go("addons"); return; }
  if (e.target.closest("#tocheckout")){ go("checkout"); return; }
  if (e.target.closest("#pay") || e.target.closest("#applepay") || e.target.closest("#gpay")){
    var T = orderTotals();
    var emEl = document.getElementById("em");
    var email = (emEl && emEl.value.trim()) || "you@example.com";
    var num = "C6-" + String(Math.floor(rnd(S.showId + S.seats.map(function(s){return s.id;}).join("")) * 900000) + 100000);
    S.order = {
      number: num, filmId: S.filmId, showId: S.showId, seats: S.seats.slice(),
      total: T.total, email: email, addonList: T.addonList, deliver: S.deliver,
      pickup: "#" + (Math.floor(rnd(num) * 89) + 10)
    };
    stopHold();
    go("confirm");
    return;
  }
});

/* ── ticket type selects ──────────────────────────────────── */
document.addEventListener("change", function(e){
  var sel = e.target.closest("[data-type]");
  if (!sel) return;
  S.types[sel.getAttribute("data-type")] = sel.value;
  render();
});

/* ── seat tooltip ─────────────────────────────────────────── */
var tip = document.getElementById("tip");
document.addEventListener("mouseover", function(e){
  var seat = e.target.closest(".seat");
  if (!seat){ tip.classList.remove("show"); return; }
  var id = seat.getAttribute("data-seat");
  var score = +seat.getAttribute("data-score");
  var label = seat.getAttribute("data-label");
  var sold = seat.getAttribute("data-state") === "sold";
  var quality = score >= 82 ? "Prime sightline" : score >= 70 ? "Very good view" : score >= 55 ? "Good view" : "Close to the screen";
  tip.innerHTML = '<div class="tt">Row ' + id.charAt(0) + ' · Seat ' + id.slice(1) + '</div>'
    + '<div class="tb">' + label + (sold ? ' · taken' : ' · ' + quality) + '</div>';
  var r = seat.getBoundingClientRect();
  tip.style.left = (r.left + r.width/2) + "px";
  tip.style.top = r.top + "px";
  tip.classList.add("show");
});
document.addEventListener("mouseout", function(e){
  if (e.target.closest(".seat")) tip.classList.remove("show");
});
window.addEventListener("scroll", function(){ tip.classList.remove("show"); }, { passive: true });

/* ── keyboard: escape leaves the booking flow ─────────────── */
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && (S.view === "seats" || S.view === "addons" || S.view === "checkout")){
    go("film", { filmId: S.filmId });
  }
});

render();
</script>
